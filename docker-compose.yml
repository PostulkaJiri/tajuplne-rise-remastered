services:
  scanner-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PADDLE_OCR_LANG: ${PADDLE_OCR_LANG:-cs}
      PADDLE_OCR_VERSION: ${PADDLE_OCR_VERSION:-PP-OCRv6}
      PADDLE_DEVICE: ${PADDLE_DEVICE:-cpu}
      PADDLE_CPU_THREADS: ${PADDLE_CPU_THREADS:-6}
      SCAN_ROTATIONS: ${SCAN_ROTATIONS:-0,-22,22}
      MATCH_ACCEPT_SCORE: ${MATCH_ACCEPT_SCORE:-78}
      MATCH_HIGH_SCORE: ${MATCH_HIGH_SCORE:-92}
      MATCH_MIN_MARGIN: ${MATCH_MIN_MARGIN:-7}
      MIN_OCR_SCORE: ${MIN_OCR_SCORE:-0.32}
      MIN_TITLE_STYLE: ${MIN_TITLE_STYLE:-0.30}
      DEBUG_SAVE_FAILED_SCANS: ${DEBUG_SAVE_FAILED_SCANS:-false}
    volumes:
      - paddle-cache:/root/.paddlex
      - scan-debug:/tmp/tajuplne-rise-scans
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      scanner-api:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"

volumes:
  paddle-cache:
  scan-debug:
