<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#121116">
  <meta name="description" content="Namiřte na karty Tajuplných říší. Vaše ruka a skóre na jedné obrazovce.">
  <title>Tajuplné říše – Remastered</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script defer src="js/config.js"></script>
  <script defer src="js/deck.js"></script>
  <script defer src="js/discard.js"></script>
  <script defer src="js/hand.js"></script>
  <script defer src="js/cards-cz.js"></script>
  <script defer src="js/scanner.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div class="appShell">
    <header class="topbar">
      <div class="brand">
        <img src="icons/icon.svg" width="36" height="36" alt="">
        <h1>Tajuplné říše<span>Remastered</span></h1>
      </div>
      <div class="totals" aria-live="polite" aria-atomic="true">
        <div class="cardCount"><strong id="handCount">0</strong><span id="countLabel">karet</span></div>
        <div class="scoreBox"><strong id="score">0</strong><span>bodů</span></div>
      </div>
    </header>

    <main class="handArea" aria-label="Naskenované karty">
      <div id="emptyHand" class="emptyHand">
        <svg viewBox="0 0 100 108" fill="none" aria-hidden="true"><rect x="17" y="14" width="54" height="76" rx="8" transform="rotate(-12 17 14)"/><rect x="30" y="19" width="54" height="76" rx="8"/><path d="m43 54 9 8 6-15 6 15 9-8-5 23H48Z"/></svg>
        <h2>Vaše karty</h2>
        <p>Namiřte fotoaparát na názvy karet.<br>Rozpoznané karty se objeví tady.</p>
      </div>
      <div id="handCards" class="cardGrid" aria-label="Karty v ruce"></div>
    </main>

    <section id="cameraFrame" class="cameraFrame" aria-label="Fotoaparát">
      <video id="camera" autoplay playsinline muted aria-label="Živý náhled fotoaparátu"></video>
      <img id="photoPreview" class="photoPreview" alt="Poslední vyfocené karty" hidden>
      <canvas id="detectionOverlay" class="detectionOverlay" aria-hidden="true"></canvas>
      <div class="viewfinder" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div id="cameraPlaceholder" class="cameraPlaceholder">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 9h5l2-3h8l2 3h5v17H5Z"/><circle cx="16" cy="17" r="5"/></svg>
        <strong id="cameraTitle">Spouštím fotoaparát…</strong>
        <span id="cameraHint">Povolte přístup ke kameře.</span>
      </div>
      <div id="ocrStatus" class="cameraStatus" role="status" aria-live="polite"></div>
      <input id="imageUpload" type="file" accept="image/*" capture="environment" hidden>
    </section>
  </div>

  <dialog id="actionDialog" aria-labelledby="actionTitle">
    <form method="dialog" class="dialogCard">
      <div class="dialogHead"><h2 id="actionTitle">Karta</h2><button value="cancel" class="closeDialog" aria-label="Zavřít">×</button></div>
      <div id="actionBody"></div>
      <div class="dialogActions">
        <button id="removeCard" type="button" class="danger">Odebrat kartu</button>
        <button id="clearEffect" type="button" hidden>Zrušit efekt</button>
        <button id="saveAction" value="default" class="primary" hidden>Uložit efekt</button>
      </div>
    </form>
  </dialog>
</body>
</html>
